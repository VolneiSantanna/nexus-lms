<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#07090e" stop-opacity="1" />
    </radialGradient>

    <!-- Top Accent Light -->
    <linearGradient id="topLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141923" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d1118" stop-opacity="0.85" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#2563eb" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#60a5fa" flood-opacity="0.3" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1280" height="720" fill="#07090e" />
  <rect width="1280" height="720" fill="url(#bgGlow)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.08" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="600" x2="1280" y2="600" />
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="480" y1="0" x2="480" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="800" y1="0" x2="800" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
  </g>

  <!-- Top Accent Beam -->
  <rect x="240" y="0" width="800" height="2" fill="url(#topLight)" />

  <!-- Central Glass Card -->
  <g filter="url(#cardShadow)">
    <rect x="260" y="110" width="760" height="500" rx="32" fill="url(#cardGrad)" stroke="#1e2533" stroke-width="1.5" />
  </g>

  <!-- Badge Top -->
  <g>
    <rect x="475" y="160" width="330" height="38" rx="19" fill="#182030" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="498" cy="179" r="4" fill="#3b82f6" />
    <text x="515" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#93c5fd" letter-spacing="2">
      PLATAFORMA EDUCACIONAL
    </text>
  </g>

  <!-- Centered Glowing Icon -->
  <g filter="url(#iconGlow)">
    <rect x="565" y="235" width="150" height="150" rx="42" fill="url(#iconGrad)" />
    <rect x="565" y="235" width="150" height="150" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    <!-- Play Triangle -->
    <path d="M632 285L672 310L632 335V285Z" fill="#ffffff" />
  </g>

  <!-- Title: Nexus LMS -->
  <text x="640" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Nexus<tspan fill="#3b82f6" font-weight="800">LMS</tspan>
  </text>

  <!-- Subtitle -->
  <text x="640" y="515" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" letter-spacing="4">
    CURSOS ONLINE • TRANSMISSÕES AO VIVO
  </text>

  <!-- Bottom Accent Line inside Card -->
  <rect x="540" y="555" width="200" height="3" rx="1.5" fill="#2563eb" opacity="0.8" />
</svg>
