<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <radialGradient id="bgGlowMin" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0b1329" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080a0f" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="iconGradMin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <filter id="iconGlowMin" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2563eb" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#60a5fa" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#080a0f" />
  <rect width="1280" height="720" fill="url(#bgGlowMin)" />

  <!-- Subtle Ambient Glow Behind Logo -->
  <circle cx="640" cy="310" r="180" fill="#2563eb" opacity="0.15" filter="blur(60px)" />

  <!-- Centered Huge Logo Icon -->
  <g filter="url(#iconGlowMin)">
    <rect x="540" y="190" width="200" height="200" rx="56" fill="url(#iconGradMin)" />
    <rect x="540" y="190" width="200" height="200" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
    <!-- Big Play Icon -->
    <path d="M625 255L685 290L625 325V255Z" fill="#ffffff" />
  </g>

  <!-- Typography: Nexus LMS -->
  <text x="640" y="475" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Nexus<tspan fill="#3b82f6" font-weight="800">LMS</tspan>
  </text>

  <text x="640" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="6">
    PLATAFORMA EDUCACIONAL
  </text>
</svg>
